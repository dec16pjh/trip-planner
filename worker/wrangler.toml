name = "trip-planner-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "2de6f6cd3c2e48529a6a1acad1153900"

[vars]
# ALLOWED_ORIGIN is safe to keep here (not a secret) - the GitHub Pages origin allowed to call this API.
ALLOWED_ORIGIN = "https://dec16pjh.github.io"
DAILY_LIMIT_PER_IP = "5"
# Where /save publishes finished plans. Not secret — just the public repo this API pushes into.
GITHUB_OWNER = "dec16pjh"
GITHUB_REPO = "trip-planner"
# Google Apps Script Web App URL that appends a row per /generate call. Fill in after
# deploying google-apps-script.gs. Not secret by itself — SHEETS_SECRET (a wrangler
# secret) is what actually protects it from randoms who might find the URL.
SHEETS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyALVU7LaklVhOTlgokmf74wnsU6vDx157_w09rQmTxouBy3SVjhw6SJrT6z9VbWDlvMg/exec"
